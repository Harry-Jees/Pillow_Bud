name: Sync distribution builds into dist

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful GitHub Actions build run ID
        required: true
        default: "39589948666"
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-dist.yml"

permissions:
  actions: read
  contents: write

jobs:
  sync-dist:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install GitHub CLI
        run: |
          type -p gh >/dev/null || (sudo apt-get update && sudo apt-get install -y gh)

      - name: Download build artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          RUN_ID="${INPUT_RUN_ID:-39589948666}"
          mkdir -p /tmp/pillow-bud-artifacts dist
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --dir /tmp/pillow-bud-artifacts
          find /tmp/pillow-bud-artifacts -type f -print

      - name: Populate dist with actual distributable files
        run: |
          set -euo pipefail
          find /tmp/pillow-bud-artifacts -type f -print0 | while IFS= read -r -d '' file; do
            name="$(basename "$file")"
            case "$name" in
              app-release.apk)
                cp "$file" "dist/pillow-bud-android.apk"
                ;;
              *.apk|*.exe|*.msi|*.zip|*.dmg|*.AppImage|*.deb)
                cp "$file" "dist/$name"
                ;;
            esac
          done
          cat > dist/README.md <<'EOF'
          # Pillow Bud distributions

          These are built distribution packages generated by GitHub Actions.
          Select the package matching your operating system and CPU architecture.

          - Android: APK (CI debug-signed unless release signing is configured)
          - Windows: EXE installer and portable ZIP
          - macOS: DMG (Intel x64 or Apple Silicon ARM64)
          - Linux: AppImage and Debian package

          The Android APK may be debug-signed and is intended for testing unless
          a managed production release keystore is configured.

          Build source: https://github.com/Harry-Jees/Pillow_Bud/actions
          EOF
          test -f dist/pillow-bud-android.apk
          test "$(find dist -maxdepth 1 -type f | wc -l)" -gt 1
          ls -lah dist

      - name: Commit distributions to main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/
          git add -f dist/pillow-bud-android.apk
          if git diff --cached --quiet; then
            echo "dist already matches downloaded packages."
            exit 0
          fi
          git commit -m "chore: add built distributions to dist [skip ci]"
          git push origin HEAD:main
